[build]
  command = "npm run build --prefix client"
  publish = "client/dist"

[[redirects]]
  from = "/api/*"
  to = "https://life-rpg-server.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
